---
AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  AppName:
    Type: String
    Description: The name of the application.
    Default: "cloudfront-website"

  Stage:
    Type: String
    Description: The stage where the application is running in, e.g., dev, prod.
    Default: "dev"

  Branch:
    Type: String
    Description: The name of the branch being deployed, this enables parallel deployments per environment if required.
    Default: "main"

  DistributionArn:
    Type: String
    Description: ARN of the CloudFront distribution to collect access logs from.

  LogRetentionInDays:
    Type: Number
    Description: Expire CloudFront access logs after this many days.
    Default: 90

Resources:
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionInDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt LogsBucket.Arn
              - !Sub "${LogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${LogsBucket.Arn}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:delivery-source:*"

          - Sid: AWSLogDeliveryAclCheck
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - s3:GetBucketAcl
              - s3:ListBucket
            Resource: !GetAtt LogsBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:delivery-source:*"

  DeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub "${AppName}-${Stage}-${Branch}-cloudfront"
      ResourceArn: !Ref DistributionArn
      LogType: ACCESS_LOGS

  DeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub "${AppName}-${Stage}-${Branch}-cloudfront-s3"
      DestinationResourceArn: !GetAtt LogsBucket.Arn
      OutputFormat: parquet

  Delivery:
    Type: AWS::Logs::Delivery
    DependsOn: LogsBucketPolicy
    Properties:
      DeliverySourceName: !Ref DeliverySource
      DeliveryDestinationArn: !GetAtt DeliveryDestination.Arn
      # Hive-compatible paths render each variable as key=value
      # (e.g. distributionid=E.../year=2026/month=11/...) for Athena partition projection.
      # Literal "key=" text in the suffix path is rejected by the service.
      S3EnableHiveCompatiblePath: true
      S3SuffixPath: "{distributionid}/{yyyy}/{MM}/{dd}/{HH}"
      # Default fields minus cs(Cookie) and fle-* (unused), plus country, ASN,
      # millisecond timestamp and origin first/last byte latency.
      # Allowed fields: aws logs describe-configuration-templates --region us-east-1
      RecordFields:
        - "date"
        - "time"
        - "x-edge-location"
        - "sc-bytes"
        - "c-ip"
        - "cs-method"
        - "cs(Host)"
        - "cs-uri-stem"
        - "sc-status"
        - "cs(Referer)"
        - "cs(User-Agent)"
        - "cs-uri-query"
        - "x-edge-result-type"
        - "x-edge-request-id"
        - "x-host-header"
        - "cs-protocol"
        - "cs-bytes"
        - "time-taken"
        - "x-forwarded-for"
        - "ssl-protocol"
        - "ssl-cipher"
        - "x-edge-response-result-type"
        - "cs-protocol-version"
        - "c-port"
        - "time-to-first-byte"
        - "x-edge-detailed-result-type"
        - "sc-content-type"
        - "sc-content-len"
        - "sc-range-start"
        - "sc-range-end"
        - "timestamp(ms)"
        - "c-country"
        - "asn"
        - "origin-fbl"
        - "origin-lbl"

  LogsBucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/config/${Stage}/${Branch}/${AppName}/cloudfront_logs_bucket"
      Type: String
      Value: !Ref LogsBucket

Outputs:
  LogsBucket:
    Value: !Ref LogsBucket

  DeliverySource:
    Value: !Ref DeliverySource
